services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_chat
      POSTGRES_USER: smart_chat
      POSTGRES_PASSWORD: smart_chat
    ports:
      - "5432:5432"
    volumes:
      - smart-chat-postgres:/var/lib/postgresql/data

  worker:
    profiles: [worker]
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["npm", "run", "worker"]
    env_file: .env
    depends_on:
      - postgres
    volumes:
      - .:/app
      - smart-chat-artifacts:/app/.data

volumes:
  smart-chat-postgres:
  smart-chat-artifacts:
