name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_chat
          POSTGRES_USER: smart_chat
          POSTGRES_PASSWORD: smart_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_chat -d smart_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://smart_chat:smart_chat@localhost:5432/smart_chat?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      AI_CONFIG_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars
      AGENT_WORKER_SECRET: ci-worker-secret-at-least-32-characters
      ARTIFACT_STORAGE_DIR: /tmp/smart-chat-ci-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Security gate
        run: npm run security:gate

      - name: Capacity gate
        run: npm run runtime:capacity

      - name: Production build
        run: npm run build
