name: Publish image

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git SHA, branch, or tag to build
        required: true

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-version-tag:
    name: version-tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require vMAJOR.MINOR.PATCH
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Skipping version-tag check for ${{ github.event_name }}"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing tag '$tag'."
            echo "Publish image only accepts vMAJOR.MINOR.PATCH, for example v1.2.3"
            echo "Not accepted: v1.2, v1.2.3-rc.1, release-1.2.3, 1.2.3"
            exit 1
          fi

  ci:
    name: recheck
    needs: assert-version-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      git_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.sha }}

  publish:
    name: build-and-push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git_ref="${{ inputs.git_ref }}"
          else
            git_ref="${{ github.sha }}"
          fi
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.git_ref }}
          fetch-depth: 0

      - name: Verify commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Resolve image tags
        id: refs
        run: |
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "git_ref=$full_sha" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
          echo "full_tag=sha-$full_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.refs.outputs.sha_tag }}
            type=raw,value=${{ steps.refs.outputs.full_tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.refs.outputs.sha_tag }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          version: v0.70.0

      - name: Summary
        run: |
          {
            echo "## Published image"
            echo "- git tag: \`${{ github.ref_name }}\`"
            echo "- sha tag: \`${{ steps.refs.outputs.sha_tag }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- image: \`ghcr.io/${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
