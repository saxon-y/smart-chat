name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git SHA or ref to build
        required: true
        default: main

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: build-and-push
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      sha_tag: ${{ steps.refs.outputs.sha_tag }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            git_ref="${{ github.event.workflow_run.head_sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git_ref="${{ inputs.git_ref }}"
          else
            git_ref="${{ github.sha }}"
          fi
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.git_ref }}

      - name: Resolve image tags
        id: refs
        run: |
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          echo "git_ref=$full_sha" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"
          echo "full_tag=sha-$full_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.refs.outputs.sha_tag }}
            type=raw,value=${{ steps.refs.outputs.full_tag }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.git_ref == 'main') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.refs.outputs.sha_tag }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Summary
        run: |
          {
            echo "## Published image"
            echo "- tag: \`${{ steps.refs.outputs.sha_tag }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- image: \`ghcr.io/${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
